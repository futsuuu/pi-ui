name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # cache-nix-action needs it to purge old caches
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c
        with:
          # keep-derivations/keep-outputs let cache-nix-action reuse
          # intermediate derivations, improving cache hit ratio.
          nix_conf: |
            keep-derivations = true
            keep-outputs = true
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          # matrix.system keeps caches separate per architecture/OS
          primary-key: nix-${{ matrix.system }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/pnpm-lock.yaml', '**/package.json') }}
          # fall back to the most recent cache of this system on key changes
          restore-prefixes-first-match: nix-${{ matrix.system }}-
          # let PRs reuse caches from the base/default branch
          restore-prefixes-all-matches: nix-${{ matrix.system }}-
          # collect garbage down to 1G before saving to keep the cache bounded
          gc-max-store-size-linux: 1G
          # purge old cache versions, keeping only the primary-key one
          purge: true
          purge-prefixes: nix-${{ matrix.system }}-
          purge-created: 0
          purge-primary-key: never
      - name: nix flake check
        run: nix flake check --keep-going

  check-windows:
    name: Check (x86_64-windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm run test
